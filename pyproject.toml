[project]
name = "codex-token-analyzer"
version = "0.1.0"
description = "Local, privacy-aware Codex token usage ledger and analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Coco Codex管家 contributors" }]
dependencies = [
  "fastapi==0.159.1",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/gronxin/codex-token-analyzer"
Issues = "https://github.com/gronxin/codex-token-analyzer/issues"

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
