[project]
name = "codex-token-analyzer"
version = "0.1.0"
description = "Local, privacy-aware Codex token usage ledger and analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
